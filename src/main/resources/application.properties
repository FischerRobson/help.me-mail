spring.application.name=mail-ms

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

# RabbitMQ full connection URL
spring.rabbitmq.addresses=${RABBITMQ_HOST}

# Define your RabbitMQ queue
spring.rabbitmq.template.default-receive-queue=${RABBITMQ_NOTIFICATION_QUEUE}
spring.rabbitmq.queue.notification=${RABBITMQ_NOTIFICATION_QUEUE}
spring.rabbitmq.queue.dlq=${RABBITMQ_DEAD_LETTER_QUEUE}
spring.rabbitmq.exchange.dlx=dlx_exchange
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.direct.default-requeue-rejected=false

# Logging
logging.level.com.example.mail=DEBUG
logging.file.name=logs/mail-service.log

